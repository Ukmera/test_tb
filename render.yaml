services:
  - type: web
    name: smc-trading-desk
    env: python
    branch: preprod
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DASHBOARD_HOST
        value: 0.0.0.0
